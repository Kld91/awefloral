<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>موقع التوصيل | أو فلورا</title>
<meta name="robots" content="noindex,nofollow">

<style>
.wh{padding:8px var(--gut) 32px}
.wh h1{margin:10px 0 4px;font-size:23px;line-height:1.4}
.wh .sub{margin:0;color:var(--muted);font-size:14.5px;line-height:1.8}
.card{border:1px solid var(--line);background:var(--paper);padding:16px;margin-top:16px;display:grid;gap:12px}
.card label{font-size:14px;font-weight:600}
.card select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.when{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--accent-soft);padding:12px 14px}
.err{color:#B3261E;font-size:13.5px;margin:0}
.done{text-align:center;padding:36px var(--gut)}
.done b{display:block;font-size:22px;margin-bottom:6px}
.legal{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:14px}
.msg{padding:40px var(--gut);text-align:center;color:var(--muted)}
.btn.primary{width:100%}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}.stars button{font-size:32px;line-height:1;background:none;border:0;color:#D8D8D8;cursor:pointer;padding:2px}.stars button.on{color:#F2B33D}
.card textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.chk{display:flex;gap:10px;align-items:center;font-weight:400!important;cursor:pointer}
.card .chk input{width:20px;height:20px;flex:none;margin:0;padding:0}
.rvph{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.rvph .btn{margin:0}
.rvprev{position:relative;width:88px;height:88px}.rvprev img{width:88px;height:88px;object-fit:cover;display:block;border:1px solid var(--line)}.rvprev button{position:absolute;top:-8px;inset-inline-end:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);font-size:13px;cursor:pointer}
.rvmsg{font-size:13.5px;color:var(--muted);margin:0}
.care{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}.care h2{font-size:18px;margin:0 0 4px}.care ul{margin:10px 0 0;padding-inline-start:20px;line-height:1.9;font-size:14.5px}.fgl{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}.fgl a{display:flex;align-items:center;gap:8px;border:1px solid var(--line);padding:6px 12px 6px 6px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:600;background:var(--paper)}.fgl img{width:36px;height:36px;object-fit:cover;border-radius:50%}
.care .got{font-size:13.5px;color:var(--muted);margin:0}
.perk{background:var(--accent-soft);padding:12px 14px;font-size:14px;line-height:1.7;margin-top:12px}
.gcode{border:1px dashed var(--ink);padding:14px;margin:16px auto 6px;max-width:320px;text-align:center}.gcode b{font-size:24px!important;letter-spacing:2px;direction:ltr;margin:0!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="logo" href="/">أو فلورا</a></header>
<main id="out"><p class="msg">…</p></main>
</div>
<script>(function(){var l=new URLSearchParams(location.search).get('l');if(!l){try{l=localStorage.getItem('awe_wl')}catch(x){}}if(!l)l=/^ar/i.test(navigator.language||'ar')?'ar':'en';window.WL=l==='en'?'en':'ar';if(WL==='en'){document.documentElement.lang='en';document.documentElement.dir='ltr';document.title='Delivery location | Awe Floral';}})();</script>
<script src="/assets/mappick.js?v=4"></script>
<script>
(function(){
  var API = 'https://awe-dashboard.le77en.workers.dev', q = new URLSearchParams(location.search), O = q.get('o'), S = q.get('s'), out = document.getElementById('out');

  var hd = document.querySelector('.top'); if(hd){ var lg = document.querySelector('.logo'); if(EN) lg.textContent = 'Awe Floral'; var sw = document.createElement('a'); sw.href = '#'; sw.textContent = EN ? 'عربي' : 'English'; sw.style.cssText = 'font-size:14px;margin-inline-start:auto;color:var(--muted)'; sw.addEventListener('click', function(ev){ ev.preventDefault(); try{ localStorage.setItem('awe_wl', EN ? 'ar' : 'en'); }catch(x){} var u = new URLSearchParams(location.search); u.set('l', EN ? 'ar' : 'en'); location.search = u.toString(); }); hd.style.display = 'flex'; hd.style.alignItems = 'center'; hd.appendChild(sw); }
  var e = function(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function(iso){ if(!iso) return ''; var p = iso.split('-').map(Number); try { return new Intl.DateTimeFormat(EN ? 'en-GB' : 'ar-SA-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(p[0], p[1] - 1, p[2])); } catch(x){ return iso; } };
  var slotHrs = function(s){ s = String(s || ''); var m = s.match(/(\d{1,2})\s*[\u2013-]\s*(\d{1,2})/); if(!m) return null; var a = +m[1]; if(/\u00b7/.test(s)) return ({ 9: [9, 12], 12: [12, 16], 4: [16, 20], 8: [20, 24] })[a] || null; var h = a === 12 || (a === 11 && /\u0635\u0628\u0627\u062d\u0627\u064b|noon|\bam\b/i.test(s)) || !/\u0638\u0647\u0631\u0627\u064b|\u0639\u0635\u0631\u0627\u064b|\u0645\u0633\u0627\u0621\u064b|\u0644\u064a\u0644\u0627\u064b|pm|midnight|noon/i.test(s) ? a : a + 12; return h >= 9 && h <= 23 ? [h, h + 1] : null; }, slotEnOf = function(h){ var f = function(x){ return x % 12 || 12; }; return f(h) + ' \u2013 ' + f(h + 1) + ' ' + (h < 11 ? 'am' : h === 11 ? 'noon' : h < 23 ? 'pm' : 'midnight'); };
  var slotT = function(sl){ var t = String(sl || '').replace(/^[^·]*·\s*/, ''); if(!EN) return t; var m = t.match(/(\d{1,2})\s*[–-]\s*(\d{1,2})/); if(!m) return t; var map = { '9': '9 am – 12 pm', '12': '12 – 4 pm', '4': '4 – 8 pm', '8': '8 pm – 12 am' }; if(/·/.test(String(sl))) return map[m[1]] || t; var r = slotHrs(sl); return r ? slotEnOf(r[0]) : t; };
  var WA = 'https://wa.me/966539804321';
  var fail = function(t){ out.innerHTML = '<p class="msg">' + t + '<br><br><a class="btn" href="' + WA + '" target="_blank" rel="noopener">' + L('راسلنا على الواتساب', 'Message us on WhatsApp') + '</a></p>'; };
  var thanks = function(j){ out.innerHTML = '<div class="done"><b>' + L('وصلنا، شكراً لك 🌸', 'Got it, thank you 🌸') + '</b><p class="sub">' + (j && j.date ? L('نوصلها لك ', 'We will deliver on ') + e(day(j.date)) + (j.slot ? ' · ' + e(slotT(j.slot)) : '') + '. ' : '') + L('بنتواصل معك قبل ما نوصل. وإذا تبي تغيّر شي، راسلنا على الواتساب.', 'We will contact you before we arrive. To change anything, message us on WhatsApp.') + '</p><p><a class="btn" href="' + WA + '" target="_blank" rel="noopener">' + L('واتساب أو فلورا', 'Awe Floral WhatsApp') + '</a></p></div>'; };
  // after delivery the same link asks the recipient for a review (their own, no price or order details shown)
  var prevHTML = function(src){ return '<div class="rvprev"><img src="' + e(src) + '" alt=""><button type="button" id="rvDrop" aria-label="' + L('شيل الصورة', 'Remove photo') + '">✕</button></div>'; };
  var shrink = function(file){ return new Promise(function(ok, no){ var url = URL.createObjectURL(file), img = new Image(); img.onerror = function(){ URL.revokeObjectURL(url); no(new Error('img')); }; img.onload = function(){ var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, 1600 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k); var c = document.createElement('canvas'); c.width = w; c.height = h; var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url); var qs = [0.82, 0.7, 0.55], i = 0; var go = function(){ if(i >= qs.length){ no(new Error('size')); return; } c.toBlob(function(b){ if(b && b.size <= 1250000) ok(b); else { i++; go(); } }, 'image/jpeg', qs[i]); }; go(); }; img.src = url; }); };
  var rvPhoto = '';
  var giftHTML = function(g){ if(!g || !g.code) return ''; return '<div class="gcode"><span class="sub">' + L('كود شكر لك 🎁 خصم ', 'A thank-you code 🎁 ') + g.pct + L('٪', '% off') + '</span><b>' + e(g.code) + '</b><span class="sub">' + L('صالح حتى ', 'Valid until ') + '<bdi dir="ltr">' + e(g.exp || '') + '</bdi></span></div><p><button type="button" class="btn" data-copy="' + e(g.code) + '">' + L('انسخ الكود', 'Copy code') + '</button></p><p class="sub">' + L('اكتبه في خانة «كود الخصم» وقت الطلب من موقعنا.', 'Enter it in the discount code box when you order on our site.') + '</p>'; };
  document.addEventListener('click', function(ev){ var c = ev.target.closest('[data-copy]'); if(!c) return; var t = c.getAttribute('data-copy'); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ c.textContent = L('انتسخ ✓', 'Copied ✓'); }).catch(function(){}); });
  // care tips for what they received (no prices, no sender details): general tips, plus lily ones when the order has lilies
  var careHTML = function(d){
    var items = (d.items || []), all = items.join(' '), lily = /ليليوم|كازابلانكا|أورينتال|lily|casablanca/i.test(all), vase = /فازة|vase/i.test(all);
    var tips = [
      vase ? L('غيّر ماء الفازة كل يومين، واغسلها إذا صار الماء عكر.', 'Change the vase water every two days, and rinse the vase if the water gets cloudy.') : L('حطه في فازة فيها ماء نظيف أول ما يوصلك.', 'Put them in a vase of clean water as soon as they arrive.'),
      L('قص أطراف السيقان قصة مايلة (1–2 سم) كل ما غيّرت الماء.', 'Trim the stems at an angle (1–2 cm) each time you change the water.'),
      L('شيل الأوراق اللي تغطس في الماء.', 'Remove any leaves that sit in the water.'),
      L('حطه بعيد عن الشمس المباشرة وهوا المكيف، وبعيد عن الفواكه.', 'Keep them away from direct sun, air-conditioning drafts and fruit.')
    ];
    if(lily){ tips.push(L('الليليوم ممكن يوصل مغلق، وهذا دليل إنه توه مقطوف، ويتفتح عندك خلال أيام.', 'Lilies may arrive closed: that means they were freshly cut, and they open over the next few days.')); tips.push(L('أول ما تتفتح الزهرة، شيل حبوب اللقاح الصفراء بمنديل: تصبغ الملابس وخطرة على القطط.', 'Once a lily opens, remove the yellow pollen with a tissue: it stains clothes and is dangerous to cats.')); }
    return '<div class="care"><h2>' + L('طريقة العناية بوردك 🌿', 'How to care for your flowers 🌿') + '</h2>' + (items.length ? '<p class="got">' + L('وصلك: ', 'You received: ') + items.map(e).join(L('، ', ', ')) + '</p>' : '') + '<div class="fgl" id="fgl"></div><ul>' + tips.map(function(t){ return '<li>' + t + '</li>'; }).join('') + '</ul></div>';
  };
  var FGEN = { carnation: 'Carnation', chrysanthemum: 'Chrysanthemum', eucalyptus: 'Eucalyptus', gerbera: 'Gerbera', hydrangea: 'Hydrangea', lily: 'Lily', orchid: 'Orchid', rose: 'Rose', solidago: 'Solidago', 'spray-rose': 'Spray rose', statice: 'Statice', sunflower: 'Sunflower' };
  // the flower guide pages for what they received (from /assets/fg.json); none matched → the guide's front page
  var guideLinks = function(d){
    fetch('/assets/fg.json').then(function(r){ return r.json(); }).then(function(F){
      var ks = [];
      (d.codes || []).forEach(function(c){ var p = /^\d+$/.test(c) ? 'g' + c : c; ((F.in || {})[p] || []).forEach(function(k){ if(ks.indexOf(k) < 0 && k !== 'eucalyptus' && k !== 'solidago') ks.push(k); }); });
      var pre = EN ? '/en/flowers/' : '/flowers/', box = document.getElementById('fgl'); if(!box) return;
      box.innerHTML = (ks.length ? ks.slice(0, 4).map(function(k){ var f = F.fg[k]; return '<a href="' + pre + k + '.html"><img src="' + e(f.i) + '" alt="">' + L('العناية ب' + e(f.n), e(FGEN[k] || k) + ' care') + ' ←</a>'; }).join('') : '') + '<a href="' + pre + '">' + L('دليل الورد كامل', 'The full flower guide') + ' ←</a>';
    }).catch(function(){ var box = document.getElementById('fgl'); if(box) box.innerHTML = '<a href="' + (EN ? '/en/flowers/' : '/flowers/') + '">' + L('دليل الورد', 'Flower guide') + ' ←</a>'; });
  };
  // following the gift (or the order): where it is now, and on our driver's run its place and the expected arrival. No prices, no sender.
  var follow = function(d){
    var hm = function(t){ try { return new Intl.DateTimeFormat(EN ? 'en-GB' : 'ar-SA-u-nu-latn', { hour: 'numeric', minute: '2-digit', hour12: true, timeZone: 'Asia/Riyadh' }).format(new Date(t)); } catch(x){ return ''; } };
    var out_ = d.stage === 'out', head, line;
    if(out_ && d.eta){ var late = d.eta.t < Date.now();
      head = d.eta.pos === 1 ? L('المندوب متجه لك الحين 🚗', 'The driver is heading to you now 🚗') : L('هديتك في الطريق 🚗', 'Your gift is on its way 🚗');
      line = (d.eta.late ? L('المندوب تأخر شوي، نعتذر منك. ', 'The driver is running a little late. ') : '') + (d.eta.pos === 1 ? '' : L('ترتيبك ' + d.eta.pos + ' في مسار المندوب. ', 'You are number ' + d.eta.pos + ' on the driver route. ')) + (late ? L('يوصلك خلال دقايق.', 'Arriving any minute.') : L('الوصول المتوقع تقريباً ', 'Expected around ') + '<b>' + e(hm(d.eta.t)) + '</b>'); }
    else if(out_){ head = L('هديتك في الطريق 🚗', 'Your gift is on its way 🚗'); line = d.courier && d.courier.url ? '<a href="' + e(d.courier.url) + '" target="_blank" rel="noopener">' + L('تابع المندوب على الخريطة', 'Follow the driver on the map') + '</a>' : L('المندوب في طريقه لك.', 'The driver is on the way to you.'); }
    else { head = d.stage === 'ready' ? L('هديتك جاهزة وتنتظر المندوب 💐', 'Your gift is ready for the driver 💐') : L('نجهّز هديتك 💐', 'We are preparing your gift 💐');
      line = d.date ? L('موعد التوصيل: ', 'Delivery: ') + e(day(d.date)) + (d.slot ? ' · ' + e(slotT(d.slot)) : '') : ''; }
    out.innerHTML = '<div class="wh"><h1>' + (d.rname ? L('هلا ', 'Hi ') + e(d.rname) + L('، ', ', ') : '') + (d.self ? L('طلبك من أو فلورا', 'your order from Awe Floral') : L('عندك هدية ورد من أو فلورا', 'a flower gift from Awe Floral is coming to you')) + '</h1>'
      + '<div class="card"><b style="font-size:18px">' + head + '</b>' + (line ? '<p class="sub" style="margin:8px 0 0">' + line + '</p>' : '') + '</div>'
      + '<p class="sub" style="margin-top:14px">' + L('الصفحة تتحدث لحالها.', 'This page updates by itself.') + (out_ ? '' : ' <a href="#edit" id="edLoc">' + L('تبي تغيّر الموقع أو الوقت؟', 'Change the location or time?') + '</a>') + '</p></div>';
    var ed = document.getElementById('edLoc'); if(ed) ed.addEventListener('click', function(){ setTimeout(function(){ location.reload(); }, 50); });
    setTimeout(function(){ if(location.hash !== '#edit') location.reload(); }, 60000);
  };
  var review = function(d){
    var st = d.mine ? d.mine.stars : 0; rvPhoto = d.mine && d.mine.ph || '';
    out.innerHTML = '<div class="wh"><h1>' + (d.rname ? L('هلا ', 'Hi ') + e(d.rname) + L('، ', ', ') : '') + L('إن شاء الله عجبك الورد؟ 🌷', 'We hope you loved the flowers 🌷') + '</h1><p class="sub">' + L('يهمنا رأيك، ياخذ دقيقة.', 'Your opinion matters, it takes a minute.') + '</p>'
      + '<div class="card"><b>' + L('تقييمك', 'Your rating') + '</b><div class="stars" id="stars">' + [1,2,3,4,5].map(function(n){ return '<button type="button" data-s="' + n + '" aria-label="' + n + L(' من 5', ' of 5') + '">★</button>'; }).join('') + '</div>'
      + '<label for="rvText">' + L('وش عجبك أو وش نحسّن؟ (اختياري)', 'What did you like, or what can we improve? (optional)') + '</label><textarea id="rvText" rows="4" maxlength="600">' + e(d.mine ? d.mine.text : '') + '</textarea>'
      + '<b>' + L('صورة الورد (اختياري)', 'Photo of the flowers (optional)') + '</b><div class="rvph"><div id="rvPrev">' + (rvPhoto ? prevHTML(API + '/card/img?id=' + encodeURIComponent(rvPhoto)) : '') + '</div><label class="btn" for="rvFile">' + L('📷 أضف صورة', '📷 Add a photo') + '</label><input type="file" id="rvFile" accept="image/*" hidden></div><p class="rvmsg" id="rvMsg"></p>'
      + '<label class="chk"><input type="checkbox" id="rvName" checked><span>' + L('اعرض اسمي الأول مع التقييم', 'Show my first name with the review') + '</span></label></div>'

    var paint = function(){ [].forEach.call(document.querySelectorAll('#stars button'), function(b){ b.classList.toggle('on', +b.dataset.s <= st); b.setAttribute('aria-pressed', +b.dataset.s === st); }); };

    document.getElementById('rvPrev').addEventListener('click', function(ev){ if(ev.target.closest('#rvDrop')){ rvPhoto = ''; this.innerHTML = ''; } });

      shrink(f).then(function(b){ blob = b; return fetch(API + '/card/upload', { method: 'POST', headers: { 'content-type': 'image/jpeg' }, body: b }); }).then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok || !j.id) throw new Error(j.error || r.status); return j; }); })

          if(j && j.ok){ out.innerHTML = '<div class="done"><b>' + L('شكراً لك 🌸', 'Thank you 🌸') + '</b><p class="sub">' + L('وصلنا تقييمك، ونتمنى نشوفك قريب.', 'We got your review. Hope to see you soon.') + '</p>' + giftHTML(j.gift) + '<div style="text-align:start">' + careHTML(d) + '</div><p style="margin-top:18px"><a class="btn" href="' + L('/', '/en/') + '">' + L('تصفّح ورد أو فلورا', 'Browse Awe Floral flowers') + '</a></p></div>'; guideLinks(d); return; }

        }).catch(function(){ b.disabled = false; b.textContent = L('أرسل التقييم', 'Send review'); er.textContent = L('ما وصل، تأكد من الإنترنت وجرّب مرة ثانية.', 'Not sent. Check your connection and try again.'); er.hidden = false; });
    });
  };
  if(!O || !S){ fail(L('الرابط ناقص.', 'This link is incomplete.')); return; }
  fetch(API + '/where?o=' + encodeURIComponent(O) + '&s=' + encodeURIComponent(S) + (q.get('q') === '1' ? '&q=1' : '')).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok){ fail(L('الرابط ما يشتغل. تأكد إنك فتحته كامل من الرسالة.', 'This link does not work. Please open it in full from the message.')); return; }
    if(d.review){ review(d); return; }
    if(d.stage !== 'off' && (d.stage === 'out' || ((d.pinned || d.done) && !d.resched && location.hash !== '#edit'))){ follow(d); return; }
    if(d.closed){ fail(L('هالطلب طلع للتوصيل أو انتهى، فما يمكن تغيير الموقع من هنا.', 'This order is already out for delivery or finished, so the location cannot be changed here.')); return; }
    var short = slotT;
    var canMove = !d.fixed && d.days && d.days.length;
    out.innerHTML = '<div class="wh"><h1>' + (d.rname ? L('هلا ', 'Hi ') + e(d.rname) + L('، ', ', ') : '') + (d.resched ? (d.self ? L('جينا نوصل طلبك وما لقيناك 💐', (d.rname ? 'we came to deliver your order and missed you 💐' : 'We came to deliver your order and missed you 💐')) : L('جينا نوصل لك هدية ورد وما لقيناك 💐', (d.rname ? 'we came to deliver your flower gift and missed you 💐' : 'We came to deliver your flower gift and missed you 💐'))) + '</h1><p class="sub">' + L('ولا يهمك، نرتب معك موعد جديد.', 'No problem, let us set a new time.') + '</p>' : (d.self ? L('طلبك جاهز للتوصيل 💐', (d.rname ? 'your order is ready for delivery 💐' : 'Your order is ready for delivery 💐')) : L('عندنا لك هدية ورد 💐', (d.rname ? 'we have a flower gift for you 💐' : 'We have a flower gift for you 💐'))) + '</h1>')
      + '<p class="sub">' + L('حدد مكانك على الخريطة', 'Set your location on the map') + (canMove ? L('، واختر اليوم والوقت اللي يناسبك', ' and choose the day and time that suit you') : '') + (d.self ? L(' عشان نوصله لك.', ' so we can deliver it.') : L(' عشان نوصلها لك.', ' so we can deliver it to you.')) + (d.done ? L(' (وصلنا منك موقع قبل، وتقدر تعدّله)', ' (we already have a location from you, you can change it)') : '') + '</p>'
      + '<div class="card"><b>📍 ' + L('الموقع', 'Location') + '</b><p class="hint" style="margin:0;font-size:13.5px;color:var(--muted)">' + L('إذا أنت في المكان الحين، افتح الخريطة واضغط «موقعي الحالي».', 'If you are there now, open the map and tap “My current location”.') + '</p>'
      + '<button type="button" class="btn" id="mpBtn"></button><div id="mpOut"></div>'
      + '<label for="note">' + L('رقم البيت أو الدور أو أي علامة تسهّل الوصول (اختياري)', 'House number, floor or any landmark that helps (optional)') + '</label><input id="note" maxlength="150" autocomplete="off"></div>'
      + '<div class="card"><b>🗓 ' + L('متى يناسبك نوصلها؟', 'When should we deliver?') + '</b>'
      + (canMove ? '<label for="wDay">' + L('اليوم', 'Day') + '</label><select id="wDay"></select><label for="wSlot">' + L('الوقت', 'Time') + '</label><select id="wSlot"></select>' : '<p class="sub" style="margin:0">' + L('بنتواصل معك ونتفق على الوقت.', 'We will contact you to agree on a time.') + '</p>') + '</div>'
      + '<p class="err" id="err" hidden></p><button type="button" class="btn primary" id="send" style="margin-top:16px">' + L('أرسل', 'Send') + '</button>'
      + '<p class="legal">' + L('نستخدم الموقع لتوصيل هالطلب بس.', 'We use your location only to deliver this order.') + '</p></div>';
    if(canMove){
      var dSel = document.getElementById('wDay'), sSel = document.getElementById('wSlot');
      dSel.innerHTML = '<option value="">' + L('اختر اليوم', 'Choose a day') + '</option>' + d.days.map(function(x){ return '<option value="' + x.day + '">' + e(day(x.day)) + '</option>'; }).join('');
      var paint = function(){ var x = d.days.filter(function(y){ return y.day === dSel.value; })[0], keep = sSel.value;
        sSel.disabled = !x; sSel.innerHTML = '<option value="">' + L('اختر الوقت', 'Choose a time') + '</option>' + (x ? x.ok.map(function(i){ return '<option value="' + i + '">' + e(short(d.slots[i])) + '</option>'; }).join('') : '');
        if(x && keep !== '' && x.ok.indexOf(+keep) >= 0) sSel.value = keep; };
      dSel.addEventListener('change', paint); paint();
    }
    MapPick.attach(document.getElementById('mpBtn'), document.getElementById('mpOut'));
    var busy = false;
    document.getElementById('send').addEventListener('click', function(){
      var link = MapPick.link(), er = document.getElementById('err');
      if(!link && !d.pinned){ er.textContent = L('حدد الموقع على الخريطة أول.', 'Set the location on the map first.'); er.hidden = false; return; }
      if(canMove && (!document.getElementById('wDay').value || document.getElementById('wSlot').value === '')){ er.textContent = L('اختر اليوم والوقت اللي يناسبك.', 'Choose the day and time that suit you.'); er.hidden = false; return; }
      if(busy) return; busy = true; er.hidden = true; this.disabled = true; this.textContent = L('نرسل…', 'Sending…');
      var b = this;
      fetch(API + '/where', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ o: O, s: S, link: link, note: document.getElementById('note').value, date: canMove ? document.getElementById('wDay').value : undefined, slot: canMove ? document.getElementById('wSlot').value : undefined }) })
        .then(function(r){ return r.json(); }).then(function(j){
          if(j && j.ok){ thanks(j); return; }
          busy = false; b.disabled = false; b.textContent = L('أرسل', 'Send');
          er.textContent = j && j.error === 'closed' ? L('هالطلب طلع للتوصيل، كلّمنا على الواتساب.', 'This order is out for delivery, message us on WhatsApp.') : j && j.error === 'slot' ? L('هالوقت ما عاد متاح، اختر وقت ثاني.', 'That time is no longer available, choose another.') : L('ما وصل، جرّب مرة ثانية.', 'Not sent, please try again.'); er.hidden = false;
        }).catch(function(){ busy = false; b.disabled = false; b.textContent = L('أرسل', 'Send'); er.textContent = L('ما وصل، تأكد من الإنترنت وجرّب مرة ثانية.', 'Not sent. Check your connection and try again.'); er.hidden = false; });
    });
  }).catch(function(){ fail(L('ما قدرنا نفتح الصفحة الحين.', 'We could not open the page right now.')); });
})();
</script>
</body>
</html>
