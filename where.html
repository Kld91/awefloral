<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>موقع التوصيل | أو فلورا</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2E3550">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/assets/fonts/plex-400-arabic.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/fonts/fonts.css?v=1">
<link rel="stylesheet" href="/assets/seo.css?v=18">
<style>
.wh{padding:8px var(--gut) 32px}
.wh h1{margin:10px 0 4px;font-size:23px;line-height:1.4}
.wh .sub{margin:0;color:var(--muted);font-size:14.5px;line-height:1.8}
.card{border:1px solid var(--line);background:var(--paper);padding:16px;margin-top:16px;display:grid;gap:12px}
.card label{font-size:14px;font-weight:600}
.card select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.card input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.when{display:flex;gap:10px;align-items:center;font-size:14.5px;background:var(--accent-soft);padding:12px 14px}
.err{color:#B3261E;font-size:13.5px;margin:0}
.done{text-align:center;padding:36px var(--gut)}
.done b{display:block;font-size:22px;margin-bottom:6px}
.legal{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:14px}
.msg{padding:40px var(--gut);text-align:center;color:var(--muted)}
.btn.primary{width:100%}
.stars{display:flex;gap:6px;direction:ltr;justify-content:flex-end}.stars button{font-size:32px;line-height:1;background:none;border:0;color:#D8D8D8;cursor:pointer;padding:2px}.stars button.on{color:#F2B33D}
.card textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-weight:400!important}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="logo" href="/">أو فلورا</a></header>
<main id="out"><p class="msg">لحظة…</p></main>
</div>
<script src="/assets/mappick.js?v=3"></script>
<script>
(function(){
  var API = 'https://awe-dashboard.le77en.workers.dev', q = new URLSearchParams(location.search), O = q.get('o'), S = q.get('s'), out = document.getElementById('out');
  var e = function(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function(iso){ if(!iso) return ''; var p = iso.split('-').map(Number); try { return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(p[0], p[1] - 1, p[2])); } catch(x){ return iso; } };
  var WA = 'https://wa.me/966539804321';
  var fail = function(t){ out.innerHTML = '<p class="msg">' + t + '<br><br><a class="btn" href="' + WA + '" target="_blank" rel="noopener">راسلنا على الواتساب</a></p>'; };
  var thanks = function(j){ out.innerHTML = '<div class="done"><b>وصلنا، شكراً لك 🌸</b><p class="sub">' + (j && j.date ? 'نوصلها لك ' + e(day(j.date)) + (j.slot ? ' · ' + e(String(j.slot).replace(/^[^·]*·\s*/, '')) : '') + '. ' : '') + 'بنتواصل معك قبل ما نوصل. وإذا تبي تغيّر شي، راسلنا على الواتساب.</p><p><a class="btn" href="' + WA + '" target="_blank" rel="noopener">واتساب أو فلورا</a></p></div>'; };
  // after delivery the same link asks the recipient for a review (their own, no price or order details shown)
  var review = function(d){
    var st = d.mine ? d.mine.stars : 0;
    out.innerHTML = '<div class="wh"><h1>' + (d.rname ? 'هلا ' + e(d.rname) + '، ' : '') + 'إن شاء الله عجبك الورد؟ 🌷</h1><p class="sub">يهمنا رأيك، ياخذ دقيقة.</p>'
      + '<div class="card"><b>تقييمك</b><div class="stars" id="stars">' + [1,2,3,4,5].map(function(n){ return '<button type="button" data-s="' + n + '" aria-label="' + n + ' من 5">★</button>'; }).join('') + '</div>'
      + '<label for="rvText">وش عجبك أو وش نحسّن؟ (اختياري)</label><textarea id="rvText" rows="4" maxlength="600">' + e(d.mine ? d.mine.text : '') + '</textarea>'
      + '<label class="chk"><input type="checkbox" id="rvName" checked> اعرض اسمي الأول مع التقييم</label></div>'
      + '<p class="err" id="err" hidden></p><button type="button" class="btn primary" id="rvSend" style="margin-top:16px">أرسل التقييم</button></div>';
    var paint = function(){ [].forEach.call(document.querySelectorAll('#stars button'), function(b){ b.classList.toggle('on', +b.dataset.s <= st); b.setAttribute('aria-pressed', +b.dataset.s === st); }); };
    document.getElementById('stars').addEventListener('click', function(ev){ var b = ev.target.closest('button'); if(b){ st = +b.dataset.s; paint(); } }); paint();
    document.getElementById('rvSend').addEventListener('click', function(){
      var er = document.getElementById('err'), b = this; if(!st){ er.textContent = 'اختر عدد النجوم.'; er.hidden = false; return; }
      b.disabled = true; b.textContent = 'نرسل…'; er.hidden = true;
      fetch(API + '/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ o: O, s: S, stars: st, text: document.getElementById('rvText').value, show_name: document.getElementById('rvName').checked }) })
        .then(function(r){ return r.json(); }).then(function(j){
          if(j && j.ok){ out.innerHTML = '<div class="done"><b>شكراً لك 🌸</b><p class="sub">وصلنا تقييمك، ونتمنى نشوفك قريب.</p><p><a class="btn" href="/">تصفّح ورد أو فلورا</a></p></div>'; return; }
          b.disabled = false; b.textContent = 'أرسل التقييم'; er.textContent = 'ما وصل التقييم، جرّب مرة ثانية.'; er.hidden = false;
        }).catch(function(){ b.disabled = false; b.textContent = 'أرسل التقييم'; er.textContent = 'ما وصل، تأكد من الإنترنت وجرّب مرة ثانية.'; er.hidden = false; });
    });
  };
  if(!O || !S){ fail('الرابط ناقص.'); return; }
  fetch(API + '/where?o=' + encodeURIComponent(O) + '&s=' + encodeURIComponent(S)).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok){ fail('الرابط ما يشتغل. تأكد إنك فتحته كامل من الرسالة.'); return; }
    if(d.review){ review(d); return; }
    if(d.closed){ fail('هالطلب طلع للتوصيل أو انتهى، فما يمكن تغيير الموقع من هنا.'); return; }
    var short = function(sl){ return String(sl || '').replace(/^[^·]*·\s*/, ''); };
    var canMove = !d.fixed && d.days && d.days.length;
    out.innerHTML = '<div class="wh"><h1>' + (d.rname ? 'هلا ' + e(d.rname) + '، ' : '') + 'عندنا لك هدية ورد 💐</h1>'
      + '<p class="sub">حدد مكانك على الخريطة' + (canMove ? '، واختر اليوم والوقت اللي يناسبك' : '') + ' عشان نوصلها لك.' + (d.done ? ' (وصلنا منك موقع قبل، وتقدر تعدّله)' : '') + '</p>'
      + '<div class="card"><b>📍 الموقع</b><p class="hint" style="margin:0;font-size:13.5px;color:var(--muted)">إذا أنت في المكان الحين، افتح الخريطة واضغط «موقعي الحالي».</p>'
      + '<button type="button" class="btn" id="mpBtn"></button><div id="mpOut"></div>'
      + '<label for="note">رقم البيت أو الدور أو أي علامة تسهّل الوصول (اختياري)</label><input id="note" maxlength="150" autocomplete="off"></div>'
      + '<div class="card"><b>🗓 متى يناسبك نوصلها؟</b>'
      + (canMove ? '<label for="wDay">اليوم</label><select id="wDay"></select><label for="wSlot">الوقت</label><select id="wSlot"></select>' : '<p class="sub" style="margin:0">بنتواصل معك ونتفق على الوقت.</p>') + '</div>'
      + '<p class="err" id="err" hidden></p><button type="button" class="btn primary" id="send" style="margin-top:16px">أرسل</button>'
      + '<p class="legal">نستخدم الموقع لتوصيل هالطلب بس.</p></div>';
    if(canMove){
      var dSel = document.getElementById('wDay'), sSel = document.getElementById('wSlot');
      dSel.innerHTML = '<option value="">اختر اليوم</option>' + d.days.map(function(x){ return '<option value="' + x.day + '">' + e(day(x.day)) + '</option>'; }).join('');
      var paint = function(){ var x = d.days.filter(function(y){ return y.day === dSel.value; })[0], keep = sSel.value;
        sSel.disabled = !x; sSel.innerHTML = '<option value="">اختر الوقت</option>' + (x ? x.ok.map(function(i){ return '<option value="' + i + '">' + e(short(d.slots[i])) + '</option>'; }).join('') : '');
        if(x && keep !== '' && x.ok.indexOf(+keep) >= 0) sSel.value = keep; };
      dSel.addEventListener('change', paint); paint();
    }
    MapPick.attach(document.getElementById('mpBtn'), document.getElementById('mpOut'));
    var busy = false;
    document.getElementById('send').addEventListener('click', function(){
      var link = MapPick.link(), er = document.getElementById('err');
      if(!link && !d.pinned){ er.textContent = 'حدد الموقع على الخريطة أول.'; er.hidden = false; return; }
      if(canMove && (!document.getElementById('wDay').value || document.getElementById('wSlot').value === '')){ er.textContent = 'اختر اليوم والوقت اللي يناسبك.'; er.hidden = false; return; }
      if(busy) return; busy = true; er.hidden = true; this.disabled = true; this.textContent = 'نرسل…';
      var b = this;
      fetch(API + '/where', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ o: O, s: S, link: link, note: document.getElementById('note').value, date: canMove ? document.getElementById('wDay').value : undefined, slot: canMove ? document.getElementById('wSlot').value : undefined }) })
        .then(function(r){ return r.json(); }).then(function(j){
          if(j && j.ok){ thanks(j); return; }
          busy = false; b.disabled = false; b.textContent = 'أرسل';
          er.textContent = j && j.error === 'closed' ? 'هالطلب طلع للتوصيل، كلّمنا على الواتساب.' : j && j.error === 'slot' ? 'هالوقت ما عاد متاح، اختر وقت ثاني.' : 'ما وصل، جرّب مرة ثانية.'; er.hidden = false;
        }).catch(function(){ busy = false; b.disabled = false; b.textContent = 'أرسل'; er.textContent = 'ما وصل، تأكد من الإنترنت وجرّب مرة ثانية.'; er.hidden = false; });
    });
  }).catch(function(){ fail('ما قدرنا نفتح الصفحة الحين.'); });
})();
</script>
</body>
</html>
