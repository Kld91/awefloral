# Runs on every push: stops a stale price or an out-of-date English page from going unnoticed.
name: Site check
on: [push, pull_request]
jobs:
  check:
    env:
      TZ: Asia/Riyadh   # dates written into pages and sitemaps follow Riyadh time, as on the build machine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prices match index.html
        run: python3 _i18n/prices.py .
      - name: Page scripts parse (Arabic and English)
        run: node _i18n/check_js.mjs
      - name: Holland and English pages are rebuilt
        env:
          PRICE_MUL_OFFLINE: '1'   # the hourly job applies new dashboard margins; here only check the pages match the last ones applied
        run: |
          python3 _i18n/make_holland.py .
          python3 _i18n/build_en.py .
          git diff --stat --exit-code -- holland.html en sitemap.xml
