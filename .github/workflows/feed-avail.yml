name: feed availability
# Every hour: products switched off in the dashboard («التوفر») go out_of_stock in merchant-feed.xml, so Google Shopping
# and the Instagram catalog stop showing what can't be ordered. See _i18n/feed_avail.py.
# Also: when the margins in the dashboard («الأسعار») change, the static prices (Holland feed, Holland type pages,
# wholesale pages, English copies) are rebuilt with the new multipliers. See _i18n/price_mul.py.
# And the product editor: names, prices, struck prices, sections, photos and new products go into index.html and every
# page that shows them. See _i18n/products_sync.py. The dashboard's «انشر الآن» starts this job at once.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: feed-avail
  cancel-in-progress: false
jobs:
  sync:
    env:
      TZ: Asia/Riyadh   # dates written into pages and sitemaps follow Riyadh time, as on the build machine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the dashboard's switches
        run: python3 _i18n/feed_avail.py .
      - run: pip install --quiet pillow==10.4.0
      - name: Products and prices follow the dashboard (product editor, margins)
        id: mul
        run: |
          P=$(python3 _i18n/products_sync.py . | tee /dev/stderr | grep -cx changed || true)
          M=$(python3 _i18n/price_mul.py . | grep -cx changed || true)
          if [ "$P" != "0" ] || [ "$M" != "0" ]; then
            python3 _i18n/prices.py . --fix
            python3 _i18n/make_holland.py . && python3 _i18n/make_wholesale_pages.py . && python3 _i18n/build_en.py . | tail -3
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Save
        run: |
          git config user.name "awe-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchant-feed.xml
          if [ "${{ steps.mul.outputs.changed }}" = "1" ]; then git add -A _i18n img/p index.html *.html flowers occasions styling ward merchant-feed.xml holland-feed.xml holland wholesale en sitemap.xml; fi
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Feed availability and prices follow the dashboard"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
