name: feed availability
# Every hour: products switched off in the dashboard («التوفر») go out_of_stock in merchant-feed.xml, so Google Shopping
# and the Instagram catalog stop showing what can't be ordered. See _i18n/feed_avail.py.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: feed-avail
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read the dashboard's switches
        run: python3 _i18n/feed_avail.py .
      - name: Save
        run: |
          git config user.name "awe-feed"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add merchant-feed.xml
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -q -m "Feed availability follows the dashboard"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
          curl -s -o /dev/null -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
