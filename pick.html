<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>فازة الأسبوع | أو فلورا</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2E3550">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/assets/fonts/plex-400-arabic.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="/assets/fonts/fonts.css?v=1">
<link rel="stylesheet" href="/assets/seo.css?v=18">
<style>
/* The subscriber picks this week's vase: shape, a ready look or colours, a note and the time */
.pk{padding:8px var(--gut) 40px}
.pk h1{margin:10px 0 4px;font-size:23px;line-height:1.4}
.pk .sub{margin:0;color:var(--muted);font-size:14.5px;line-height:1.8}
.sec{margin-top:22px}
.sec h2{font-size:16px;margin:0 0 4px}
.sec .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{border:1px solid var(--line);background:var(--paper);padding:8px;text-align:center;cursor:pointer;display:grid;gap:6px;font:inherit;color:var(--ink);font-size:14px}
.opt[aria-pressed="true"]{border:2px solid var(--ink);padding:7px}
.opt .im{width:100%;aspect-ratio:1;background:#F1F1EE center/cover no-repeat;display:grid;place-items:center}
.opt svg{width:56%;height:auto;color:var(--muted)}
.cols{display:flex;flex-wrap:wrap;gap:8px}
.col{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);padding:8px 12px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.col i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.12);display:inline-block}
.col[aria-pressed="true"]{border:2px solid var(--ink);padding:7px 11px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 10px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
textarea,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--line);font:inherit;font-size:16px;background:var(--paper);color:var(--ink)}
.two-sel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#B3261E;font-size:13.5px;margin:10px 0 0}
.btn.primary{width:100%;margin-top:22px}
.done{text-align:center;padding:36px var(--gut)}
.done b{display:block;font-size:22px;margin-bottom:6px}
.mine{background:var(--accent-soft);padding:12px 14px;font-size:14.5px;margin-top:14px;line-height:1.8}
.msg{padding:40px var(--gut);text-align:center;color:var(--muted)}
.pnote{background:var(--accent-soft);padding:10px 14px;font-size:14px;margin-top:12px}
</style>
</head>
<body>
<div class="app">
<header class="top"><a class="logo" href="/">أو فلورا</a></header>
<main id="out"><p class="msg">لحظة…</p></main>
</div>
<script>
(function(){
  var API = 'https://awe-dashboard.le77en.workers.dev', q = new URLSearchParams(location.search), O = q.get('o'), S = q.get('s'), out = document.getElementById('out');
  var e = function(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var day = function(iso){ if(!iso) return ''; var p = iso.split('-').map(Number); try { return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' }).format(new Date(p[0], p[1] - 1, p[2])); } catch(x){ return iso; } };
  var short = function(sl){ return String(sl || '').replace(/^[^·]*·\s*/, ''); };
  var WA = 'https://wa.me/966539804321';
  var fail = function(t){ out.innerHTML = '<p class="msg">' + t + '<br><br><a class="btn" href="' + WA + '" target="_blank" rel="noopener">راسلنا على الواتساب</a></p>'; };
  // simple outlines when the florist has no photo of a shape
  var SVG = {
    round: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10h16v6c8 4 12 10 12 18a20 20 0 0 1-40 0c0-8 4-14 12-18z"/></svg>',
    tall: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 4h16l-2 6v44H24V10z"/></svg>',
    wide: '<svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 20h44l-6 30H14z"/></svg>'
  };
  var D = null, pick = { vase: '', look: '', colors: [], note: '', date: '', slot: '', keep: true };

  function paint(){
    var d = D, h = '<div class="pk"><h1>' + (d.name ? 'هلا ' + e(d.name) + '، ' : '') + 'رتّب فازة الأسبوع على ذوقك 🌷</h1>'
      + '<p class="sub">الفازة ' + d.k + ' من ' + d.of + ' في اشتراكك. اختر من المتوفر اليوم، والفلورست يجهزها لك.</p>'
      + (d.note ? '<div class="pnote">' + e(d.note) + '</div>' : '')
      + (d.mine ? '<div class="mine">اخترت قبل: ' + e(d.mine.txt) + '<br>تقدر تعدّل لين نبدأ نجهزها.</div>' : d.pref ? '<div class="mine">جهزنا لك اختيارك المعتاد من الأسابيع اللي قبل. عدّل إذا تبي، أو أرسله مثل ما هو.</div>' : '');
    h += '<div class="sec"><h2>شكل الفازة</h2><div class="grid">' + d.vases.map(function(v){
      return '<button type="button" class="opt" data-vase="' + e(v.k) + '" aria-pressed="' + (pick.vase === v.k) + '"><span class="im"' + (v.img ? ' style="background-image:url(' + API + e(v.img) + ')"' : '') + '>' + (v.img ? '' : (SVG[v.k] || '')) + '</span>' + e(v.n) + '</button>'; }).join('') + '</div></div>';
    if(d.looks.length) h += '<div class="sec"><h2>تنسيق جاهز من اليوم</h2><p class="hint">صوّرها الفلورست من الورد المتوفر.</p><div class="grid two">' + d.looks.map(function(l){
      return '<button type="button" class="opt" data-look="' + e(l.id) + '" aria-pressed="' + (pick.look === l.id) + '"><span class="im"' + (l.img ? ' style="background-image:url(' + API + e(l.img) + ')"' : '') + '></span>' + e(l.n) + '</button>'; }).join('') + '</div></div>';
    if(d.colors.length) h += (d.looks.length ? '<div class="or">أو اختر ألوانك</div>' : '<div class="sec"><h2>الألوان</h2></div>')
      + '<p class="hint" style="font-size:13px;color:var(--muted);margin:0 0 10px">من لون إلى ثلاثة ألوان، والفلورست ينسقها لك.</p><div class="cols">' + d.colors.map(function(c){
        return '<button type="button" class="col" data-color="' + e(c.id) + '" aria-pressed="' + (pick.colors.indexOf(c.id) > -1) + '"><i style="background:' + e(c.hex) + '"></i>' + e(c.n) + '</button>'; }).join('') + '</div>';
    h += '<div class="sec"><h2>ملاحظة للفلورست <span style="font-weight:400;color:var(--muted);font-size:13px">(اختياري)</span></h2><textarea id="note" rows="3" maxlength="300" placeholder="مثل: بدون ليليوم، أو أحب الألوان الهادية">' + e(pick.note) + '</textarea></div>';
    if(d.days.length) h += '<div class="sec"><h2>وقت التوصيل</h2><div class="two-sel"><select id="dDay" aria-label="اليوم">' + d.days.map(function(x){ return '<option value="' + x.day + '"' + (x.day === pick.date ? ' selected' : '') + '>' + e(day(x.day)) + '</option>'; }).join('')
      + '</select><select id="dSlot" aria-label="الوقت"></select></div></div>';
    h += '<label style="display:flex;gap:10px;align-items:center;margin-top:18px;font-size:14.5px"><input type="checkbox" id="keep" style="width:20px;height:20px"' + (pick.keep ? ' checked' : '') + '> خلّه اختياري لباقي أسابيع الاشتراك</label>'
      + '<p class="hint" style="font-size:13px;color:var(--muted);margin:4px 0 0">لو ما فتحت الرابط الأسبوع الجاي، الفلورست يسويها لك على نفس الشكل والألوان.</p>';
    h += '<p class="err" id="err" hidden></p><button type="button" class="btn primary" id="send">' + (d.mine ? 'احفظ التعديل' : 'أرسل اختياري') + '</button></div>';
    out.innerHTML = h; slots();
  }
  function slots(){
    var dd = document.getElementById('dDay'), ss = document.getElementById('dSlot'); if(!dd || !ss) return;
    var x = D.days.filter(function(y){ return y.day === dd.value; })[0];
    var cur = pick.date === dd.value ? D.slots.indexOf(pick.slot) : -1;
    ss.innerHTML = (x ? x.ok : []).map(function(i){ return '<option value="' + i + '"' + (i === cur ? ' selected' : '') + '>' + e(short(D.slots[i])) + '</option>'; }).join('');
  }
  out.addEventListener('change', function(ev){ if(ev.target.id === 'dDay') slots(); });
  out.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    var n = document.getElementById('note'); if(n) pick.note = n.value;
    if(b.dataset.vase){ pick.vase = b.dataset.vase; mark(); return; }
    if(b.dataset.look){ pick.look = pick.look === b.dataset.look ? '' : b.dataset.look; if(pick.look) pick.colors = []; mark(); return; }
    if(b.dataset.color){ var id = b.dataset.color, i = pick.colors.indexOf(id);
      if(i > -1) pick.colors.splice(i, 1); else { if(pick.colors.length >= 3) pick.colors.shift(); pick.colors.push(id); }
      if(pick.colors.length) pick.look = ''; mark(); return; }
    if(b.id === 'send') send(b);
  });
  function mark(){
    out.querySelectorAll('[data-vase]').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.vase === pick.vase); });
    out.querySelectorAll('[data-look]').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.look === pick.look); });
    out.querySelectorAll('[data-color]').forEach(function(x){ x.setAttribute('aria-pressed', pick.colors.indexOf(x.dataset.color) > -1); });
  }
  function send(b){
    var er = document.getElementById('err'), dd = document.getElementById('dDay'), ss = document.getElementById('dSlot');
    var bad = !pick.vase ? 'اختر شكل الفازة.' : (!pick.look && !pick.colors.length) ? (D.looks.length ? 'اختر تنسيق جاهز أو لون واحد على الأقل.' : 'اختر لون واحد على الأقل.') : '';
    if(bad){ er.textContent = bad; er.hidden = false; return; }
    er.hidden = true; b.disabled = true; b.textContent = 'نرسل…';
    var kp = document.getElementById('keep'); pick.keep = !!(kp && kp.checked);
    var body = { o: O, s: S, vase: pick.vase, look: pick.look, colors: pick.colors, note: pick.note, keep: pick.keep };
    if(dd && ss && ss.value !== '') { body.date = dd.value; body.slot = +ss.value; }
    fetch(API + '/pick', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.json(); }).then(function(j){
      if(j && j.ok){ out.innerHTML = '<div class="done"><b>وصلنا اختيارك، شكراً لك 🌸</b><p class="sub">' + e(j.txt) + '<br>نوصلها لك ' + e(day(j.date)) + (j.slot ? ' · ' + e(short(j.slot)) : '') + '.</p><p class="sub" style="margin-top:10px">تبي تغيّر؟ افتح نفس الرابط مرة ثانية قبل ما نبدأ نجهزها.</p></div>'; return; }
      b.disabled = false; b.textContent = D.mine ? 'احفظ التعديل' : 'أرسل اختياري';
      er.textContent = j && j.error === 'gone' ? 'واحد من اختياراتك خلص للتو، اختر غيره.' : j && j.error === 'closed' ? 'بدأنا نجهز فازتك، فما يمكن التعديل الحين. كلّمنا على الواتساب.' : j && j.error === 'slot' ? 'هالوقت ما عاد متاح، اختر وقت ثاني.' : 'ما وصل، جرّب مرة ثانية.';
      er.hidden = false; if(j && j.error === 'gone') load();
    }).catch(function(){ b.disabled = false; b.textContent = 'أرسل اختياري'; er.textContent = 'ما وصل، تأكد من الإنترنت وجرّب مرة ثانية.'; er.hidden = false; });
  }
  function load(){
    fetch(API + '/pick?o=' + encodeURIComponent(O) + '&s=' + encodeURIComponent(S)).then(function(r){ return r.json(); }).then(function(d){
      if(!d || !d.ok){ fail('الرابط ما يشتغل. تأكد إنك فتحته كامل من الرسالة.'); return; }
      if(d.done){ fail('وصلتك فازة هالأسبوع، إن شاء الله عجبتك 🌷'); return; }
      if(!d.open){ fail('بدأنا نجهز فازتك، فما يمكن التغيير من هنا.'); return; }
      if(!d.vases.length || (!d.looks.length && !d.colors.length)){ fail('تشكيلة اليوم ما نزلت للحين. نرسل لك الرابط أول ما تجهز.'); return; }
      D = d;
      if(d.mine){ pick.vase = d.mine.vase; pick.look = d.mine.look; pick.colors = d.mine.colors.slice(); pick.note = d.mine.note; }
      else if(d.pref){ pick.vase = d.pref.vase || ''; pick.note = d.pref.note || ''; pick.colors = d.colors.filter(function(c){ return (d.pref.cns || []).indexOf(c.n) > -1; }).map(function(c){ return c.id; }).slice(0, 3); }
      pick.keep = d.mine ? !!d.pref : true;
      if(!d.vases.some(function(v){ return v.k === pick.vase; })) pick.vase = d.vases.length === 1 ? d.vases[0].k : '';
      if(pick.look && !d.looks.some(function(l){ return l.id === pick.look; })) pick.look = '';
      pick.colors = pick.colors.filter(function(id){ return d.colors.some(function(c){ return c.id === id; }); });
      pick.date = d.date; pick.slot = d.slot;
      paint();
    }).catch(function(){ fail('ما قدرنا نفتح الصفحة، تأكد من الإنترنت.'); });
  }
  if(!O || !S){ fail('الرابط ناقص.'); return; }
  load();
})();
</script>
</body>
</html>
