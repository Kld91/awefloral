<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Reem+Kufi:wght@700&display=swap">
<title>{{TITLE}} | {{BRAND}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://www.rawnbatat.com/{{PATH}}">
<link rel="alternate" hreflang="ar" href="https://www.rawnbatat.com/{{AR}}"><link rel="alternate" hreflang="en" href="https://www.rawnbatat.com/{{EN}}"><link rel="alternate" hreflang="x-default" href="https://www.rawnbatat.com/{{AR}}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css?v=1">
<style>
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:#F7F6F3;color:#1F2633;line-height:1.85}
header{background:#fff;border-bottom:1px solid #E4E1DA}
.bar{max-width:760px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar a{color:inherit;text-decoration:none;flex:none;white-space:nowrap}.bar b{font-family:"Reem Kufi","IBM Plex Sans Arabic",sans-serif;font-size:22px;color:#4A5069;font-weight:700}.bar span{font-size:13px;color:#6B6F76;margin-inline-start:6px}
main{max-width:760px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:24px;margin:0 0 10px}h2{font-size:17px;margin:26px 0 6px}
p,li{font-size:15.5px;color:#30363F}ul{padding-inline-start:20px;margin:6px 0}
footer{border-top:1px solid #E4E1DA;background:#fff}
.ft{max-width:760px;margin:0 auto;padding:18px 16px 28px;font-size:13.5px;color:#4A4F57}
.ft nav{display:flex;flex-wrap:wrap;gap:6px 16px;margin-bottom:10px}.ft a{color:inherit}
</style>
</head>
<body>
<header><div class="bar"><a href="{{HOME}}"><b>{{BRAND}}</b><span>{{WS}}</span></a><a href="/{{OTHER}}" hreflang="{{OLANG}}">{{OLABEL}}</a></div></header>
<main>
{{BODY}}
</main>
<footer><div class="ft"><nav>{{LINKS}}</nav>{{LEGAL}}</div></footer>
</body>
</html>
